name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://www.cheapflights.com.au
      API_BASE_URL: https://restful-booker.herokuapp.com
      API_AUTH_PASSWORD: ${{ secrets.API_AUTH_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run authentication tests
      run: npx playwright test tests/flight-booking/api/tests/00-auth.spec.ts --project=chromium --workers=1
    - name: Run booking lifecycle in order
      run: npm run test:booking-lifecycle
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
